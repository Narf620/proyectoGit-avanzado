name: CI

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README
        run: |
          echo "Añadida feature: ${{ github.head_ref || github.ref_name }}" >> README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update README with feature"
          git push origin HEAD:${{ github.event.pull_request.base.ref || github.ref_name }}

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validate DEV_TOKEN
        shell: bash
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if [ "$DEV_TOKEN" = "$LOCAL_DEV_TOKEN" ]; then
            echo "DEV_TOKEN validado correctamente"
          else
            echo "DEV_TOKEN no coincide con LOCAL_DEV_TOKEN"
            exit 1
          fi
